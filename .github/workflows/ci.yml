name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check qwm tests scripts
      - name: Test
        run: pytest -q
      - name: Smoke-run the CLI
        run: |
          qwm demo
          qwm resources --out /tmp/qwm
          qwm evaluate --images camera,coins --size 64 --out /tmp/qwm
          qwm paper-checks --out /tmp/qwm/checks
          qwm embed camera --mode keyed --key ci-key --nonce ci -o /tmp/qwm/keyed.png
          qwm verify /tmp/qwm/keyed.png --mode keyed --key ci-key --nonce ci
          qwm tamper-study --images camera,coins,moon --repeats 1 --out /tmp/qwm/tamper
